<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">From a growing diary to an execution dashboard</title>
  <desc id="desc">On the left, every turn appends an observation, reasoning, and action to a history that must be reread. On the right, the agent receives a fixed specification, current state, and latest observation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c0a"/><stop offset="1" stop-color="#1b1d18"/></linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4a574" stop-opacity=".22"/><stop offset="1" stop-color="#a9c48c" stop-opacity=".08"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="24" fill="url(#grid)"/>
  <text x="64" y="62" fill="#d4a574" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">TWO WAYS TO REACH THE NEXT STEP</text>
  <text x="64" y="105" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="32" font-weight="700">Reread the entire past—or inspect the present?</text>
  <line x1="600" y1="140" x2="600" y2="552" stroke="#46463f" stroke-dasharray="5 9"/>

  <g>
    <text x="64" y="178" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="23" font-weight="700">The diary</text>
    <text x="64" y="205" fill="#817d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5">APPEND-ONLY HISTORY</text>
    <g transform="translate(72 242)">
      <rect x="0" y="0" width="142" height="174" rx="10" fill="#171813" stroke="#3d3e36"/>
      <text x="18" y="28" fill="#807c72" font-family="monospace" font-size="12">TURN 01</text>
      <rect x="18" y="48" width="70" height="7" rx="3.5" fill="#5e5c53"/><rect x="18" y="67" width="102" height="7" rx="3.5" fill="#3c3c35"/><rect x="18" y="86" width="84" height="7" rx="3.5" fill="#3c3c35"/>
      <text x="18" y="124" fill="#b4b0a5" font-family="monospace" font-size="11">O · R · A</text>
    </g>
    <g transform="translate(190 224)">
      <rect x="0" y="0" width="160" height="210" rx="10" fill="#191a15" stroke="#4b4b42"/>
      <text x="18" y="28" fill="#928d81" font-family="monospace" font-size="12">TURN 25</text>
      <g fill="#4b4a42"><rect x="18" y="48" width="118" height="7" rx="3.5"/><rect x="18" y="67" width="92" height="7" rx="3.5"/><rect x="18" y="86" width="124" height="7" rx="3.5"/><rect x="18" y="105" width="103" height="7" rx="3.5"/><rect x="18" y="124" width="115" height="7" rx="3.5"/></g>
      <text x="18" y="166" fill="#c5c0b4" font-family="monospace" font-size="11">O · R · A · …</text>
    </g>
    <g transform="translate(326 204)">
      <rect x="0" y="0" width="196" height="248" rx="12" fill="#1d1d18" stroke="#a36f52" stroke-width="1.5"/>
      <text x="20" y="30" fill="#d4a574" font-family="monospace" font-size="12">TURN 100</text>
      <g fill="#5a4a3f"><rect x="20" y="52" width="146" height="8" rx="4"/><rect x="20" y="72" width="118" height="8" rx="4"/><rect x="20" y="92" width="154" height="8" rx="4"/><rect x="20" y="112" width="132" height="8" rx="4"/><rect x="20" y="132" width="145" height="8" rx="4"/><rect x="20" y="152" width="106" height="8" rx="4"/><rect x="20" y="172" width="151" height="8" rx="4"/></g>
      <text x="20" y="212" fill="#e2ddd2" font-family="Arial, sans-serif" font-size="15" font-weight="700">Find the current fact</text>
      <text x="20" y="233" fill="#8b867a" font-family="Arial, sans-serif" font-size="13">inside everything before it.</text>
    </g>
  </g>

  <g>
    <text x="648" y="178" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="23" font-weight="700">The dashboard</text>
    <text x="648" y="205" fill="#817d72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.5">EXPLICIT EXECUTION STATE</text>
    <rect x="648" y="235" width="488" height="217" rx="18" fill="url(#state)" stroke="#d4a574" stroke-width="1.5"/>
    <g transform="translate(672 260)">
      <rect width="126" height="80" rx="10" fill="#151610" stroke="#4f5046"/>
      <text x="16" y="25" fill="#d4a574" font-family="monospace" font-size="13">P · FIXED</text>
      <text x="16" y="53" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">Rules</text>
      <text x="16" y="70" fill="#807d72" font-family="Arial, sans-serif" font-size="12">and tools</text>
    </g>
    <g transform="translate(816 260)">
      <rect width="176" height="166" rx="12" fill="#20221b" stroke="#a9c48c" stroke-width="1.5"/>
      <text x="18" y="27" fill="#a9c48c" font-family="monospace" font-size="13">Σt · NOW</text>
      <text x="18" y="57" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">Current state</text>
      <line x1="18" y1="76" x2="158" y2="76" stroke="#404239"/>
      <text x="18" y="101" fill="#bdb9ad" font-family="monospace" font-size="12">item_12</text><text x="151" y="101" text-anchor="end" fill="#d4a574" font-family="monospace" font-size="12">shelf_42</text>
      <text x="18" y="125" fill="#bdb9ad" font-family="monospace" font-size="12">next</text><text x="151" y="125" text-anchor="end" fill="#d4a574" font-family="monospace" font-size="12">ship</text>
      <text x="18" y="149" fill="#bdb9ad" font-family="monospace" font-size="12">status</text><text x="151" y="149" text-anchor="end" fill="#a9c48c" font-family="monospace" font-size="12">ready</text>
    </g>
    <g transform="translate(1010 260)">
      <rect width="102" height="80" rx="10" fill="#151610" stroke="#4f5046"/>
      <text x="14" y="25" fill="#d4a574" font-family="monospace" font-size="13">Ot</text>
      <text x="14" y="52" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="14" font-weight="700">Latest</text>
      <text x="14" y="69" fill="#807d72" font-family="Arial, sans-serif" font-size="12">observation</text>
    </g>
    <text x="672" y="442" fill="#aba69b" font-family="Arial, sans-serif" font-size="12">Turn 100 has the same input shape as turn 1.</text>
  </g>

  <g transform="translate(64 502)">
    <rect width="1072" height="76" rx="12" fill="#151610" stroke="#34352f"/>
    <text x="26" y="30" fill="#8f8a7f" font-family="monospace" font-size="12" letter-spacing="1">CUMULATIVE COST</text>
    <text x="26" y="56" fill="#e4b78c" font-family="Arial, sans-serif" font-size="18" font-weight="700">History: O(T²)</text>
    <line x1="515" y1="18" x2="515" y2="58" stroke="#3d3e37"/>
    <text x="550" y="30" fill="#8f8a7f" font-family="monospace" font-size="12" letter-spacing="1">IF P, Σ, AND O STAY BOUNDED</text>
    <text x="550" y="56" fill="#b9d19f" font-family="Arial, sans-serif" font-size="18" font-weight="700">State: O(T)</text>
  </g>
</svg>
