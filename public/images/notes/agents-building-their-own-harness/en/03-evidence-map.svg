<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Evidence map for agent-built harnesses</title>
  <desc id="desc">Five industrial and academic cases show what agents edit, how changes are evaluated, and the scope of each result.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c0a"/><stop offset="1" stop-color="#1b1d18"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/><rect width="1200" height="640" rx="24" fill="url(#grid)"/>
  <text x="64" y="58" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">POSSIBILITY ≠ TOTAL AUTHORITY</text>
  <text x="64" y="103" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">What agents build. What remains protected.</text>

  <g transform="translate(64 142)">
    <rect width="1072" height="48" rx="10" fill="#20211b"/>
    <text x="22" y="31" fill="#918d82" font-family="monospace" font-size="11" letter-spacing="1.5">CASE</text><text x="380" y="31" fill="#918d82" font-family="monospace" font-size="11" letter-spacing="1.5">AGENT-WRITTEN SURFACE</text><text x="708" y="31" fill="#918d82" font-family="monospace" font-size="11" letter-spacing="1.5">GATE</text><text x="906" y="31" fill="#918d82" font-family="monospace" font-size="11" letter-spacing="1.5">SCOPE</text>
    <g transform="translate(0 60)"><rect width="1072" height="66" rx="10" fill="#171813" stroke="#34352f"/><circle cx="24" cy="33" r="6" fill="#d4a574"/><text x="43" y="28" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">OpenAI</text><text x="43" y="48" fill="#7f7b72" font-family="Arial, sans-serif" font-size="12">internal product</text><text x="380" y="38" fill="#d6d1c7" font-family="Arial, sans-serif" font-size="15">repo · CI · AGENTS · evals</text><text x="708" y="38" fill="#a9c48c" font-family="Arial, sans-serif" font-size="15">humans + CI</text><text x="906" y="38" fill="#d4a574" font-family="monospace" font-size="12">1 REAL CASE</text></g>
    <g transform="translate(0 138)"><rect width="1072" height="66" rx="10" fill="#171813" stroke="#34352f"/><circle cx="24" cy="33" r="6" fill="#d4a574"/><text x="43" y="28" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">Anthropic tools</text><text x="43" y="48" fill="#7f7b72" font-family="Arial, sans-serif" font-size="12">internal MCP</text><text x="380" y="38" fill="#d6d1c7" font-family="Arial, sans-serif" font-size="15">tools · schemas · descriptions</text><text x="708" y="38" fill="#a9c48c" font-family="Arial, sans-serif" font-size="15">held-out + review</text><text x="906" y="38" fill="#d4a574" font-family="monospace" font-size="12">TOOLS</text></g>
    <g transform="translate(0 216)"><rect width="1072" height="66" rx="10" fill="#171813" stroke="#34352f"/><circle cx="24" cy="33" r="6" fill="#a9c48c"/><text x="43" y="38" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">Meta-Harness</text><text x="380" y="38" fill="#d6d1c7" font-family="Arial, sans-serif" font-size="15">harness source code</text><text x="708" y="38" fill="#a9c48c" font-family="Arial, sans-serif" font-size="15">external tasks</text><text x="906" y="38" fill="#d4a574" font-family="monospace" font-size="12">EXTERNAL SEARCH</text></g>
    <g transform="translate(0 294)"><rect width="1072" height="66" rx="10" fill="#171813" stroke="#34352f"/><circle cx="24" cy="33" r="6" fill="#a9c48c"/><text x="43" y="38" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">Self-Harness</text><text x="380" y="38" fill="#d6d1c7" font-family="Arial, sans-serif" font-size="15">bounded edits to its own H</text><text x="708" y="38" fill="#a9c48c" font-family="Arial, sans-serif" font-size="15">held-in + held-out</text><text x="906" y="38" fill="#d4a574" font-family="monospace" font-size="12">3×3 BENCHMARKS</text></g>
    <g transform="translate(0 372)"><rect width="1072" height="66" rx="10" fill="#171813" stroke="#34352f"/><circle cx="24" cy="33" r="6" fill="#a9c48c"/><text x="43" y="38" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="16" font-weight="700">AHE</text><text x="380" y="38" fill="#d6d1c7" font-family="Arial, sans-serif" font-size="15">tools · middleware · memory</text><text x="708" y="28" fill="#a9c48c" font-family="Arial, sans-serif" font-size="15">read-only verifier</text><text x="708" y="48" fill="#7f7b72" font-family="Arial, sans-serif" font-size="12">protected config and traces</text><text x="906" y="38" fill="#d4a574" font-family="monospace" font-size="12">10 ITERATIONS</text></g>
  </g>
  <text x="600" y="608" text-anchor="middle" fill="#8f8a7f" font-family="monospace" font-size="13" letter-spacing="1.4">CONVERGENCE: BOUNDED CHANGE · OBSERVABLE TRACE · PROTECTED EVALUATION</text>
</svg>
