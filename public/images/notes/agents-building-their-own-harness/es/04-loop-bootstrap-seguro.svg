<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Bootstrap seguro de un harness</title>
  <desc id="desc">El harness activo produce traces; un agente propone una variante aislada; un evaluador externo ejecuta regresiones; un gate promueve o revierte.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c0a"/><stop offset="1" stop-color="#1b1d18"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#d4a574"/></marker><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#a9c48c"/></marker></defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/><rect width="1200" height="640" rx="24" fill="url(#grid)"/>
  <text x="64" y="58" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">BOOTSTRAP SIN AUTO-CERTIFICACIÓN</text>
  <text x="64" y="103" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Construir H(t+1) sin soltar H(t).</text>

  <g transform="translate(64 202)"><rect width="180" height="154" rx="20" fill="#1d1d18" stroke="#d4a574"/><text x="22" y="32" fill="#d4a574" font-family="monospace" font-size="12">ACTIVO</text><text x="90" y="86" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="37" font-weight="700">H(t)</text><text x="90" y="119" text-anchor="middle" fill="#89857b" font-family="Arial, sans-serif" font-size="13">versión estable</text></g>
  <path d="M248 278H302" stroke="#d4a574" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="260" text-anchor="middle" fill="#817d72" font-family="monospace" font-size="10">TRACES</text>
  <g transform="translate(310 176)"><rect width="210" height="206" rx="20" fill="#171e16" stroke="#526149"/><text x="22" y="32" fill="#a9c48c" font-family="monospace" font-size="12">PROPONENTE</text><circle cx="105" cy="91" r="34" fill="#20271d" stroke="#a9c48c"/><path d="M89 91H121M105 75V107" stroke="#a9c48c" stroke-width="3"/><text x="105" y="151" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="18" font-weight="700">diff mínimo</text><text x="105" y="177" text-anchor="middle" fill="#899384" font-family="Arial, sans-serif" font-size="13">desde evidencia</text></g>
  <path d="M524 278H578" stroke="#d4a574" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(586 176)"><rect width="210" height="206" rx="20" fill="#17191d" stroke="#657486" stroke-dasharray="6 6"/><text x="22" y="32" fill="#9eafc3" font-family="monospace" font-size="12">CANDIDATO AISLADO</text><text x="105" y="101" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">H(t+1)?</text><text x="105" y="140" text-anchor="middle" fill="#8e949b" font-family="Arial, sans-serif" font-size="13">branch · sandbox</text><text x="105" y="166" text-anchor="middle" fill="#8e949b" font-family="Arial, sans-serif" font-size="13">sin secretos raíz</text></g>
  <path d="M800 278H854" stroke="#d4a574" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(862 176)"><rect width="274" height="206" rx="20" fill="#211714" stroke="#8b4d34"/><text x="22" y="32" fill="#d39173" font-family="monospace" font-size="12">GATE EXTERNO</text><text x="22" y="70" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="19" font-weight="700">Intentar refutar</text><g fill="#b9afa8" font-family="Arial, sans-serif" font-size="14"><text x="22" y="103">✓ tareas held-out</text><text x="22" y="130">✓ regresiones + costo</text><text x="22" y="157">✓ permisos + revisión</text></g><rect x="182" y="73" width="68" height="68" rx="34" fill="#34211a" stroke="#d39173"/><path d="M203 107L216 120 232 92" fill="none" stroke="#d39173" stroke-width="4"/></g>

  <path d="M999 386V450H760" fill="none" stroke="#a9c48c" stroke-width="2" marker-end="url(#greenArrow)"/><text x="909" y="437" fill="#a9c48c" font-family="monospace" font-size="11">PASA → PROMOVER</text>
  <rect x="586" y="425" width="168" height="88" rx="16" fill="#1c2119" stroke="#a9c48c"/><text x="670" y="462" text-anchor="middle" fill="#a9c48c" font-family="monospace" font-size="11">NUEVO ACTIVO</text><text x="670" y="492" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="25" font-weight="700">H(t+1)</text>
  <path d="M998 386V542H156V364" fill="none" stroke="#a36f52" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow)"/><text x="487" y="564" fill="#d39173" font-family="monospace" font-size="11">FALLA → ROLLBACK · H(t) SIGUE DISPONIBLE</text>
  <text x="64" y="611" fill="#8f8a7f" font-family="monospace" font-size="12">LINEAGE: TRACE + DIFF + SCORE + DECISIÓN</text>
</svg>
