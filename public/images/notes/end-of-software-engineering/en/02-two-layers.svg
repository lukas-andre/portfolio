<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Ephemeral code over durable infrastructure</title>
  <desc id="desc">A top capsule contains temporary scripts and queries. A durable platform below contains the model, tools, permissions, memory, observability, evaluations, and governance.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0d0b"/><stop offset="1" stop-color="#1e1e1a"/></linearGradient><linearGradient id="ephemeral" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a85a32" stop-opacity=".28"/><stop offset="1" stop-color="#d4a574" stop-opacity=".08"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="64" y="64" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">TWO LAYERS, TWO TIMESCALES</text><text x="64" y="108" fill="#f5f2eb" font-family="sans-serif" font-size="32" font-weight="600">Disposable work needs a substrate that is not.</text>
  <rect x="180" y="156" width="840" height="128" rx="64" fill="url(#ephemeral)" stroke="#d4a574" stroke-dasharray="7 7"/><circle cx="240" cy="220" r="27" fill="#d4a574"/><text x="240" y="228" text-anchor="middle" fill="#0d0d0b" font-family="monospace" font-size="22">✦</text>
  <text x="290" y="205" fill="#d4a574" font-family="monospace" font-size="13" letter-spacing="2">EPHEMERAL LAYER · PER TASK</text><text x="290" y="239" fill="#f5f2eb" font-family="sans-serif" font-size="22">scripts · queries · transformations · intermediate plans</text><text x="290" y="263" fill="#7a756a" font-family="sans-serif" font-size="15">generate → execute → verify → discard</text>
  <path d="M600 285V330" stroke="#d4a574" stroke-width="2"/><rect x="64" y="330" width="1072" height="275" rx="18" fill="#191916" stroke="#4a4640"/><text x="96" y="370" fill="#8a9a7c" font-family="monospace" font-size="13" letter-spacing="2">DURABLE SUBSTRATE · ACROSS TASKS</text>
  <g font-family="sans-serif">
    <g transform="translate(96 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Model + runtime</text><text x="18" y="53" fill="#7a756a" font-size="13">ability to reason</text></g>
    <g transform="translate(342 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Tools + APIs</text><text x="18" y="53" fill="#7a756a" font-size="13">ability to act</text></g>
    <g transform="translate(588 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Permissions + sandbox</text><text x="18" y="53" fill="#7a756a" font-size="13">blast radius</text></g>
    <g transform="translate(834 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Memory + state</text><text x="18" y="53" fill="#7a756a" font-size="13">continuity</text></g>
    <g transform="translate(96 494)"><rect width="306" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Traces + observability</text><text x="18" y="53" fill="#7a756a" font-size="13">explain what happened</text></g>
    <g transform="translate(423 494)"><rect width="306" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Tests + evaluations</text><text x="18" y="53" fill="#7a756a" font-size="13">prove the outcome</text></g>
    <g transform="translate(750 494)"><rect width="308" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Limits + governance</text><text x="18" y="53" fill="#7a756a" font-size="13">stop, escalate, revert</text></g>
  </g>
  <text x="600" y="648" text-anchor="middle" fill="#7a756a" font-family="monospace" font-size="13">THE HARNESS IS THE ENGINEERED PRODUCT</text>
</svg>
