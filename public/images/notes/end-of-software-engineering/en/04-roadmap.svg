<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap with decreasing certainty</title>
  <desc id="desc">Four connected stages show tool augmentation, autonomous tasks, multi-agent teams, and self-evolving ecosystems. The evidence base decreases toward future stages.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0d0b"/><stop offset="1" stop-color="#1e1e1a"/></linearGradient><linearGradient id="certainty" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8a9a7c"/><stop offset=".48" stop-color="#d4a574"/><stop offset="1" stop-color="#a85a32" stop-opacity=".25"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><text x="64" y="64" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">THE PAPER'S ROADMAP · NOT A VALIDATED FORECAST</text><text x="64" y="108" fill="#f5f2eb" font-family="sans-serif" font-size="32" font-weight="600">The farther out, the more assumptions.</text><line x1="116" y1="336" x2="1084" y2="336" stroke="url(#certainty)" stroke-width="6"/>
  <g font-family="sans-serif">
    <g transform="translate(76 170)"><rect width="238" height="300" rx="14" fill="#20211d" stroke="#8a9a7c"/><text x="22" y="42" fill="#8a9a7c" font-family="monospace" font-size="13">I · 2023–2025</text><text x="22" y="83" fill="#f5f2eb" font-size="21" font-weight="600">Tool</text><text x="22" y="110" fill="#f5f2eb" font-size="21" font-weight="600">augmentation</text><text x="22" y="155" fill="#c9c4b8" font-size="15">Completes code</text><text x="22" y="179" fill="#c9c4b8" font-size="15">and resolves issues.</text><rect x="22" y="232" width="104" height="29" rx="14" fill="#8a9a7c"/><text x="74" y="252" text-anchor="middle" fill="#0d0d0b" font-family="monospace" font-size="11">OBSERVED</text></g>
    <g transform="translate(346 170)"><rect width="238" height="300" rx="14" fill="#22211d" stroke="#b7a06d"/><text x="22" y="42" fill="#d4a574" font-family="monospace" font-size="13">II · 2025–2027</text><text x="22" y="83" fill="#f5f2eb" font-size="21" font-weight="600">Autonomous</text><text x="22" y="110" fill="#f5f2eb" font-size="21" font-weight="600">task</text><text x="22" y="155" fill="#c9c4b8" font-size="15">From specification</text><text x="22" y="179" fill="#c9c4b8" font-size="15">to pull request.</text><rect x="22" y="232" width="104" height="29" rx="14" fill="#5c543e"/><text x="74" y="252" text-anchor="middle" fill="#e8dcc8" font-family="monospace" font-size="11">EMERGING</text></g>
    <g transform="translate(616 170)"><rect width="238" height="300" rx="14" fill="#211e1a" stroke="#8b6544"/><text x="22" y="42" fill="#c48c5d" font-family="monospace" font-size="13">III · 2026–2029</text><text x="22" y="83" fill="#f5f2eb" font-size="21" font-weight="600">Multi-agent</text><text x="22" y="110" fill="#f5f2eb" font-size="21" font-weight="600">teams</text><text x="22" y="155" fill="#c9c4b8" font-size="15">Coordinated roles</text><text x="22" y="179" fill="#c9c4b8" font-size="15">across the lifecycle.</text><rect x="22" y="232" width="99" height="29" rx="14" fill="#503c2d"/><text x="71" y="252" text-anchor="middle" fill="#e8dcc8" font-family="monospace" font-size="11">PROPOSED</text></g>
    <g transform="translate(886 170)"><rect width="238" height="300" rx="14" fill="#1d1b18" stroke="#573a2b" stroke-dasharray="6 6"/><text x="22" y="42" fill="#a85a32" font-family="monospace" font-size="13">IV · 2028+</text><text x="22" y="83" fill="#f5f2eb" font-size="21" font-weight="600">Self-evolving</text><text x="22" y="110" fill="#f5f2eb" font-size="21" font-weight="600">ecosystem</text><text x="22" y="155" fill="#c9c4b8" font-size="15">Modifies itself and</text><text x="22" y="179" fill="#c9c4b8" font-size="15">spawns sub-agents.</text><rect x="22" y="232" width="116" height="29" rx="14" fill="#3d2b23"/><text x="80" y="252" text-anchor="middle" fill="#c9c4b8" font-family="monospace" font-size="11">SPECULATIVE</text></g>
  </g>
  <text x="76" y="550" fill="#8a9a7c" font-family="monospace" font-size="13">MORE EVIDENCE</text><text x="1124" y="550" text-anchor="end" fill="#a85a32" font-family="monospace" font-size="13">MORE ASSUMPTIONS</text><rect x="76" y="570" width="1048" height="10" rx="5" fill="url(#certainty)"/><text x="600" y="628" text-anchor="middle" fill="#7a756a" font-family="monospace" font-size="13">A POSSIBLE SEQUENCE IS NOT AN INEVITABLE DESTINATION</text>
</svg>
