  <g fill="#f5f2eb" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle"><text x="190" y="163">95%</text><text x="410" y="225">77%</text><text x="630" y="285">60%</text><text x="850" y="357">46%</text><text x="1010" y="370">36%</text></g>
