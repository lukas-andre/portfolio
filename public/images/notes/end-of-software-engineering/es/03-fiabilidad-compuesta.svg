<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">La confiabilidad se compone</title>
  <desc id="desc">Una curva baja de 95 por ciento para un paso a 36 por ciento para veinte pasos, suponiendo 95 por ciento de éxito independiente en cada paso.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0d0b"/><stop offset="1" stop-color="#1e1e1a"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4a574" stop-opacity=".28"/><stop offset="1" stop-color="#d4a574" stop-opacity="0"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="64" y="64" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">MODELO ILUSTRATIVO · pⁿ</text>
  <text x="64" y="108" fill="#f5f2eb" font-family="sans-serif" font-size="32" font-weight="600">Un buen paso no garantiza una buena trayectoria.</text>
