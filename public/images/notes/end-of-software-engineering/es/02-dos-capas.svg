<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Código efímero sobre infraestructura durable</title>
  <desc id="desc">Una cápsula superior contiene scripts y consultas temporales. Debajo, una plataforma durable contiene modelo, herramientas, permisos, memoria, observabilidad, evaluaciones y gobierno.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0d0b"/><stop offset="1" stop-color="#1e1e1a"/></linearGradient><linearGradient id="ephemeral" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a85a32" stop-opacity=".28"/><stop offset="1" stop-color="#d4a574" stop-opacity=".08"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <text x="64" y="64" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">DOS CAPAS, DOS RITMOS</text>
  <text x="64" y="108" fill="#f5f2eb" font-family="sans-serif" font-size="32" font-weight="600">Lo descartable necesita una base que no lo sea.</text>

  <rect x="180" y="156" width="840" height="128" rx="64" fill="url(#ephemeral)" stroke="#d4a574" stroke-dasharray="7 7"/>
  <circle cx="240" cy="220" r="27" fill="#d4a574"/><text x="240" y="228" text-anchor="middle" fill="#0d0d0b" font-family="monospace" font-size="22">✦</text>
  <text x="290" y="205" fill="#d4a574" font-family="monospace" font-size="13" letter-spacing="2">CAPA EFÍMERA · POR TAREA</text>
  <text x="290" y="239" fill="#f5f2eb" font-family="sans-serif" font-size="22">scripts · consultas · transformaciones · planes intermedios</text>
  <text x="290" y="263" fill="#7a756a" font-family="sans-serif" font-size="15">se genera → se ejecuta → se verifica → se descarta</text>

  <path d="M600 285V330" stroke="#d4a574" stroke-width="2"/>
  <rect x="64" y="330" width="1072" height="275" rx="18" fill="#191916" stroke="#4a4640"/>
  <text x="96" y="370" fill="#8a9a7c" font-family="monospace" font-size="13" letter-spacing="2">SUSTRATO DURABLE · ENTRE TAREAS</text>
  <g font-family="sans-serif">
    <g transform="translate(96 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Modelo + runtime</text><text x="18" y="53" fill="#7a756a" font-size="13">capacidad de razonar</text></g>
    <g transform="translate(342 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Herramientas + APIs</text><text x="18" y="53" fill="#7a756a" font-size="13">capacidad de actuar</text></g>
    <g transform="translate(588 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Permisos + sandbox</text><text x="18" y="53" fill="#7a756a" font-size="13">radio de impacto</text></g>
    <g transform="translate(834 400)"><rect width="224" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Memoria + estado</text><text x="18" y="53" fill="#7a756a" font-size="13">continuidad</text></g>
    <g transform="translate(96 494)"><rect width="306" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Trazas + observabilidad</text><text x="18" y="53" fill="#7a756a" font-size="13">explicar qué ocurrió</text></g>
    <g transform="translate(423 494)"><rect width="306" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Tests + evaluaciones</text><text x="18" y="53" fill="#7a756a" font-size="13">probar el resultado</text></g>
    <g transform="translate(750 494)"><rect width="308" height="72" rx="10" fill="#24241f" stroke="#3e3d36"/><text x="18" y="30" fill="#f5f2eb" font-size="17">Límites + gobierno</text><text x="18" y="53" fill="#7a756a" font-size="13">detener, escalar, revertir</text></g>
  </g>
  <text x="600" y="648" text-anchor="middle" fill="#7a756a" font-family="monospace" font-size="13">EL HARNESS ES EL PRODUCTO DE INGENIERÍA</text>
</svg>
