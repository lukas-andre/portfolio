<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Tres trayectorias, según las condiciones de partida</title><desc id="desc">Tres filas muestran capital creciente. La primera mantiene redistribución; la segunda cambia de redistribución a represión al cruzar un umbral teórico; la tercera mantiene represión. Todas dependen de la supervivencia del régimen y de los supuestos de acumulación del teorema.</desc>
<defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none"/>
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">03 / LAS TRES TRAYECTORIAS DEL TEOREMA</text>
<text x="56" y="98" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="38" font-weight="400" text-anchor="start">El acuerdo puede durar. O puede cambiar.</text>
<text x="56" y="139" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start">La amenaza se compara con los costos y la eficacia de cada respuesta.</text><text x="365" y="196" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start">CAPITAL INICIAL</text><text x="1130" y="196" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="end">MÁS CAPITAL →</text><text x="56" y="268" fill="#929181" font-family="Georgia, DejaVu Serif, serif" font-size="26" font-weight="400" text-anchor="start">01</text><text x="104" y="266" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">AMENAZA BAJA</text><line x1="384" y1="290" x2="1112" y2="290" stroke="#aec09c" stroke-width="3" marker-end="url(#sage)"/><circle cx="384" cy="290" r="5" fill="#aec09c"/><text x="365" y="260" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="400" text-anchor="start">Redistribución</text><text x="1130" y="260" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="400" text-anchor="end">Redistribución</text><text x="56" y="386" fill="#dfb37b" font-family="Georgia, DejaVu Serif, serif" font-size="26" font-weight="400" text-anchor="start">02</text><text x="104" y="384" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">AMENAZA INTERMEDIA</text><rect x="345" y="335" width="799" height="92" rx="6" fill="#252019" stroke="#454639"/><line x1="384" y1="408" x2="1112" y2="408" stroke="#df947d" stroke-width="3" marker-end="url(#rust)"/><line x1="384" y1="408" x2="758" y2="408" stroke="#aec09c" stroke-width="3" /><line x1="758" y1="338" x2="758" y2="418" stroke="#dfb37b" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="758" cy="408" r="7" fill="#dfb37b"/><text x="758" y="325" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="middle">UMBRAL TEÓRICO</text><circle cx="384" cy="408" r="5" fill="#aec09c"/><text x="365" y="378" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="400" text-anchor="start">Redistribución</text><text x="1130" y="378" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="400" text-anchor="end">Represión</text><text x="56" y="504" fill="#929181" font-family="Georgia, DejaVu Serif, serif" font-size="26" font-weight="400" text-anchor="start">03</text><text x="104" y="502" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">AMENAZA ALTA</text><line x1="384" y1="526" x2="1112" y2="526" stroke="#df947d" stroke-width="3" marker-end="url(#rust)"/><circle cx="384" cy="526" r="5" fill="#df947d"/><text x="365" y="496" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="400" text-anchor="start">Represión</text><text x="1130" y="496" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="23" font-weight="400" text-anchor="end">Represión</text>
<line x1="56" y1="612" x2="1144" y2="612" stroke="#454639" stroke-width="1" />
<text x="56" y="646" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start">Condicionado a supervivencia del régimen, capital inicial admisible y acumulación sostenida (Theorem 1).</text>
</svg>
