<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Producing more and capturing more are different goals</title><desc id="desc">Qualitative scale with five levels: regulation only, redistribution, market and maximum output, maximum return to capital, and repression.</desc>
<defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none"/>
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">02 / FIVE POINTS, TWO OBJECTIVES</text>
<text x="56" y="98" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="38" font-weight="400" text-anchor="start">Producing more ≠ capturing more</text>
<rect x="590" y="150" width="554" height="406" rx="0" fill="#252019" stroke="none"/><text x="866" y="176" fill="#df947d" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="middle">TOTAL OUTPUT STARTS FALLING</text><line x1="104" y1="332" x2="1102" y2="332" stroke="#c0b9aa" stroke-width="2" marker-end="url(#amber)"/><line x1="130" y1="300" x2="130" y2="323" stroke="#aec09c" stroke-width="1.5" /><circle cx="130" cy="332" r="7" fill="#aec09c"/><text x="64" y="206" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">I₀</text><text x="64" y="237" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">Regulation</text>
<text x="64" y="265" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">only</text><text x="64" y="293" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Preserves labor income.</text><line x1="350" y1="343" x2="350" y2="382" stroke="#aec09c" stroke-width="1.5" /><circle cx="350" cy="332" r="7" fill="#aec09c"/><text x="244" y="422" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">Iₛ</text><text x="244" y="453" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">Redistribution</text><text x="244" y="514" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Compensates to go further.</text><line x1="590" y1="300" x2="590" y2="323" stroke="#dfb37b" stroke-width="1.5" /><circle cx="590" cy="332" r="11" fill="#dfb37b"/><text x="486" y="206" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">Iᵈ = Iʸ</text><text x="486" y="237" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">Maximum</text>
<text x="486" y="265" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">output</text><text x="486" y="293" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">The market’s choice.</text><line x1="820" y1="343" x2="820" y2="382" stroke="#dfb37b" stroke-width="1.5" /><circle cx="820" cy="332" r="7" fill="#dfb37b"/><text x="722" y="422" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">Iᴷ</text><text x="722" y="453" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">Maximum</text>
<text x="722" y="481" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">capital income</text><text x="722" y="514" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">Without revolt risk.</text><line x1="1060" y1="300" x2="1060" y2="323" stroke="#df947d" stroke-width="1.5" /><circle cx="1060" cy="332" r="7" fill="#df947d"/><text x="958" y="206" fill="#df947d" font-family="DejaVu Sans Mono, monospace" font-size="16" font-weight="400" text-anchor="start">Iʳ</text><text x="958" y="237" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">With</text>
<text x="958" y="265" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" text-anchor="start">repression</text><text x="958" y="293" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">The highest level.</text><text x="104" y="580" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="start">LESS AUTOMATION</text><text x="1102" y="580" fill="#df947d" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="end">MORE AUTOMATION →</text>
<line x1="56" y1="612" x2="1144" y2="612" stroke="#454639" stroke-width="1" />
<text x="56" y="646" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start">Ordering proved in the model. Positions and distances between points do not represent measured magnitudes.</text>
</svg>
