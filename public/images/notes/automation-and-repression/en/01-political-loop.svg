<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The political calculation behind automation</title><desc id="desc">Loop where more automation lowers labor's income share, raises revolt incentives, and leads the state to choose between growing redistribution and repression, which enables more automation.</desc>
<defs><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none"/>
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">01 / DISTRIBUTION, RISK, AND RESPONSE</text>
<text x="56" y="98" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="38" font-weight="400" text-anchor="start">Automation changes the calculation</text>
<path d="M1144 514H1172V143H216V170" fill="none" stroke="#df947d" stroke-width="2" marker-end="url(#rust)"/><text x="706" y="134" fill="#df947d" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" text-anchor="middle">REPRESSION MAKES ROOM FOR MORE AUTOMATION</text><path d="M64 514H28V158H152V170" fill="none" stroke="#aec09c" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#sage)"/><line x1="64" y1="178" x2="364" y2="178" stroke="#dfb37b" stroke-width="3" /><text x="64" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">More tasks</text>
<text x="64" y="245" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">to capital</text><text x="64" y="274" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Automation displaces</text>
<text x="64" y="299" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">labor from tasks.</text><line x1="450" y1="178" x2="750" y2="178" stroke="#dfb37b" stroke-width="3" /><text x="450" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">Lower</text>
<text x="450" y="245" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">labor share</text><text x="450" y="274" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Workers receive a smaller</text>
<text x="450" y="299" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">share of income.</text><line x1="834" y1="178" x2="1134" y2="178" stroke="#df947d" stroke-width="3" /><text x="834" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">Greater risk</text>
<text x="834" y="245" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="start">of revolt</text><text x="834" y="274" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">What workers stand to lose</text>
<text x="834" y="299" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">weighs less against the prize.</text><line x1="382" y1="226" x2="428" y2="226" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><line x1="766" y1="226" x2="812" y2="226" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><path d="M978 314V330H600V345" fill="none" stroke="#df947d" stroke-width="2" marker-end="url(#rust)"/><text x="600" y="373" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="middle">The state protects capital’s expected income</text><path d="M600 391V413H314V439" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><path d="M600 391V413H884V439" fill="none" stroke="#df947d" stroke-width="2" marker-end="url(#rust)"/><rect x="64" y="450" width="500" height="133" rx="6" fill="#232b20" stroke="#aec09c"/><rect x="644" y="450" width="500" height="133" rx="6" fill="#30231e" stroke="#df947d"/><text x="88" y="487" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="26" font-weight="400" text-anchor="start">Redistribute</text><text x="88" y="521" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Lower labor share → higher tax rate.</text>
<text x="88" y="548" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Compensation allows more automation, at a cost.</text><text x="668" y="487" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="26" font-weight="400" text-anchor="start">Repress</text><text x="668" y="521" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Fixed share of output; fixed residual revolt risk.</text>
<text x="668" y="548" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">The cost does not rise in the same way.</text>
<line x1="56" y1="612" x2="1144" y2="612" stroke="#454639" stroke-width="1" />
<text x="56" y="646" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" text-anchor="start">Model mechanism. The dashed return indicates the partial restraint under redistribution.</text>
</svg>
