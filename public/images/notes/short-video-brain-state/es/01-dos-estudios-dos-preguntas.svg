<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Dos estudios, dos preguntas</title>
  <desc id="desc">Comparación entre el experimento agudo de Hong con 56 personas y doce minutos de videos, y el estudio transversal de Horvath con 22 personas clasificadas con uso problemático y 26 controles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c0a"/><stop offset="1" stop-color="#1a1c17"/></linearGradient>
    <linearGradient id="acute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4a574" stop-opacity=".2"/><stop offset="1" stop-color="#d4a574" stop-opacity=".04"/></linearGradient>
    <linearGradient id="assoc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a9a7c" stop-opacity=".2"/><stop offset="1" stop-color="#8a9a7c" stop-opacity=".04"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="680" rx="24" fill="url(#grid)"/>
  <text x="62" y="57" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">UNA PREGUNTA · DOS RELOJES</text>
  <text x="62" y="101" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="33" font-weight="700">¿Qué nos dice realmente una imagen cerebral?</text>

  <g transform="translate(62 146)">
    <rect width="470" height="390" rx="18" fill="url(#acute)" stroke="#d4a574" stroke-width="1.5"/>
    <text x="28" y="40" fill="#d4a574" font-family="monospace" font-size="13" letter-spacing="2">HONG ET AL. · 2026</text>
    <text x="28" y="86" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="29" font-weight="700">Mientras miras</text>
    <text x="28" y="116" fill="#969184" font-family="Arial, sans-serif" font-size="16">Experimento dentro del escáner</text>
    <line x1="28" y1="145" x2="442" y2="145" stroke="#5b5147"/>
    <text x="28" y="224" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="76" font-weight="700">12 min</text>
    <text x="31" y="257" fill="#d4a574" font-family="monospace" font-size="14" letter-spacing="1.6">2 BLOQUES · 56 JÓVENES</text>
    <rect x="28" y="288" width="414" height="70" rx="10" fill="#10110e" stroke="#3c3d36"/>
    <text x="48" y="317" fill="#a9c48c" font-family="monospace" font-size="12">MIDE</text>
    <text x="48" y="343" fill="#ded9ce" font-family="Arial, sans-serif" font-size="17" font-weight="700">Un estado agudo durante clips</text>
  </g>

  <g transform="translate(668 146)">
    <rect width="470" height="390" rx="18" fill="url(#assoc)" stroke="#8a9a7c" stroke-width="1.5"/>
    <text x="28" y="40" fill="#a9c48c" font-family="monospace" font-size="13" letter-spacing="2">HORVATH ET AL. · 2020</text>
    <text x="28" y="86" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="29" font-weight="700">Entre dos grupos</text>
    <text x="28" y="116" fill="#969184" font-family="Arial, sans-serif" font-size="16">Comparación transversal</text>
    <line x1="28" y1="145" x2="442" y2="145" stroke="#465044"/>
    <text x="28" y="224" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="76" font-weight="700">22 + 26</text>
    <text x="31" y="257" fill="#a9c48c" font-family="monospace" font-size="14" letter-spacing="1.6">USO PROBLEMÁTICO · CONTROL</text>
    <rect x="28" y="288" width="414" height="70" rx="10" fill="#10110e" stroke="#3c3d36"/>
    <text x="48" y="317" fill="#a9c48c" font-family="monospace" font-size="12">MIDE</text>
    <text x="48" y="343" fill="#ded9ce" font-family="Arial, sans-serif" font-size="17" font-weight="700">Diferencias asociadas al grupo</text>
  </g>

  <g transform="translate(552 266)">
    <circle cx="48" cy="48" r="47" fill="#11120f" stroke="#5a584f"/>
    <text x="48" y="59" text-anchor="middle" fill="#d4a574" font-family="Arial, sans-serif" font-size="35" font-weight="700">≠</text>
  </g>

  <g transform="translate(62 573)">
    <rect width="1076" height="67" rx="12" fill="#12130f" stroke="#373831"/>
    <circle cx="28" cy="33" r="5" fill="#d4a574"/>
    <text x="48" y="39" fill="#e8e3d8" font-family="Arial, sans-serif" font-size="18" font-weight="700">Se unen por la pregunta. No forman una secuencia causal.</text>
    <text x="1018" y="39" text-anchor="end" fill="#77736a" font-family="monospace" font-size="12">ESTADO ≠ DESTINO</text>
  </g>
</svg>
