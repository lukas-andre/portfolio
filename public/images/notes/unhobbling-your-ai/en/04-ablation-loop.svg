<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">One variable. The same test.</title><desc id="desc">A fixed setup feeds two parallel variants: current harness H₀ and H₁ without one component. Both undergo the same evaluation. Adopt the change if the system improves without quality regression or boundary violations; otherwise keep H₀ and prepare another trial.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">04 / AN ATTRIBUTABLE CHANGE</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">One variable. The same test.</text>
<rect x="56" y="151" width="1088" height="79" rx="5" fill="#24251e" stroke="#454639" /><text x="80" y="179" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">FIXED IN BOTH VARIANTS</text><text x="80" y="212" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start">Model · tasks · tests · budget · permissions</text><path d="M600 230V248H298V267" fill="none" stroke="#c0b9aa" stroke-width="2" marker-end="url(#muted)"/><path d="M600 248H902V267" fill="none" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><rect x="56" y="278" width="484" height="108" rx="5" fill="#20211b" stroke="#454639" /><rect x="660" y="278" width="484" height="108" rx="5" fill="#2b251c" stroke="#dfb37b" /><text x="80" y="310" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">H₀ / BASELINE</text><text x="684" y="310" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">H₁ / CANDIDATE</text><text x="80" y="353" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="30" font-weight="400" text-anchor="start">The current harness</text><text x="684" y="353" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="29" font-weight="400" text-anchor="start">The same − one piece</text><path d="M298 386V412H557V430" fill="none" stroke="#c0b9aa" stroke-width="2" marker-end="url(#muted)"/><path d="M902 386V412H643V430" fill="none" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><text x="600" y="463" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="600" text-anchor="middle">Repeat · measure · compare</text><text x="600" y="495" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Quality, cost, and failures under the same test.</text><path d="M600 511V524H298V542" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><path d="M600 524H902V542" fill="none" stroke="#df947d" stroke-width="2" marker-end="url(#rust)"/><text x="298" y="569" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Improves without regression → adopt H₁</text><text x="902" y="569" fill="#df947d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Worse or unclear → keep H₀</text><path d="M1156 561H1174V331H1156" fill="none" stroke="#df947d" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#rust)"/>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Proposed protocol, not results. The return prepares another trial; a new model requires a new baseline.</text>
</svg>
