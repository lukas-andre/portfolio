<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">From suggesting to checking</title><desc id="desc">The same model and task, fixing a bug, branch into two interfaces. Text ends in a proposal that a person executes. Tools enable a cycle of editing, testing, and reading the result.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">01 / PRODUCT OVERHANG</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">It can suggest. Can it check?</text>
<rect x="56" y="155" width="1088" height="82" rx="5" fill="#24251e" stroke="#454639" /><text x="80" y="187" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">SAME MODEL · SAME TASK</text><text x="80" y="217" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">Fix a bug</text><text x="1118" y="207" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end">What changes: the interface</text><path d="M600 237V263H292V293" fill="none" stroke="#c0b9aa" stroke-width="2" marker-end="url(#muted)"/><path d="M600 263H892V293" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><text x="56" y="330" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">01 / TEXT ONLY</text><text x="640" y="330" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">02 / EDITING + TESTS</text><line x1="56" y1="347" x2="528" y2="347" stroke="#454639" stroke-width="1" /><line x1="640" y1="347" x2="1144" y2="347" stroke="#aec09c" stroke-width="1" /><rect x="56" y="371" width="472" height="117" rx="5" fill="#20211b" stroke="#454639" /><text x="80" y="410" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">A suggested patch</text><text x="80" y="445" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">A person applies it, runs the tests,</text>
<text x="80" y="473" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">and brings back the result.</text><line x1="292" y1="488" x2="292" y2="537" stroke="#c0b9aa" stroke-width="2" /><line x1="278" y1="537" x2="306" y2="537" stroke="#c0b9aa" stroke-width="3" /><text x="292" y="572" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Execution stays outside the product.</text><rect x="640" y="371" width="208" height="70" rx="5" fill="#232b20" stroke="#aec09c" /><rect x="936" y="371" width="208" height="70" rx="5" fill="#232b20" stroke="#aec09c" /><text x="744" y="415" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Edit</text><text x="1040" y="415" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Test</text><path d="M857 406H925" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><path d="M1040 441V471H892V490" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><rect x="738" y="500" width="308" height="61" rx="5" fill="#232b20" stroke="#aec09c" /><text x="892" y="539" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Read the result</text><path d="M738 530H674V451" fill="none" stroke="#aec09c" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#sage)"/><text x="1080" y="590" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="end">Iterate if needed</text>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Conceptual example: more ability to act neither guarantees success nor authorizes broader permissions.</text>
</svg>
