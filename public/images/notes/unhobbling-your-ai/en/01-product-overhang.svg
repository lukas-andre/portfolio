<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">The gap between capability and product</title>
  <desc id="desc">A large outline represents everything the model can do and an inner one the part the product allows it to use. The space between them is product overhang.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0c0a"/><stop offset="1" stop-color="#1c1d18"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4a574" stop-opacity=".18"/><stop offset="1" stop-color="#a9c48c" stop-opacity=".05"/></linearGradient>
    <linearGradient id="product" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9c48c" stop-opacity=".25"/><stop offset="1" stop-color="#526149" stop-opacity=".08"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/><rect width="1200" height="640" rx="24" fill="url(#grid)"/>
  <text x="64" y="58" fill="#d4a574" font-family="monospace" font-size="15" letter-spacing="3">PRODUCT OVERHANG</text>
  <text x="64" y="103" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">The model already can. The product still can't.</text>

  <rect x="64" y="150" width="816" height="354" rx="78" fill="url(#model)" stroke="#d4a574" stroke-width="2" stroke-dasharray="8 9"/>
  <text x="104" y="192" fill="#e7bd92" font-family="monospace" font-size="14" letter-spacing="2">THE MODEL'S ACTUAL CAPABILITY</text>
  <text x="104" y="224" fill="#918b7e" font-family="Arial, sans-serif" font-size="15">reason · write · navigate · use tools · sustain a loop</text>

  <rect x="220" y="260" width="510" height="170" rx="34" fill="url(#product)" stroke="#a9c48c" stroke-width="2"/>
  <text x="475" y="315" text-anchor="middle" fill="#a9c48c" font-family="monospace" font-size="14" letter-spacing="2">WHAT THE PRODUCT ALLOWS</text>
  <text x="475" y="358" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="30" font-weight="700">usable surface</text>
  <text x="475" y="391" text-anchor="middle" fill="#a9a59a" font-family="Arial, sans-serif" font-size="15">UI + tools + permissions + context</text>

  <path d="M749 272C825 247 827 206 850 194" fill="none" stroke="#d4a574" stroke-width="2"/>
  <circle cx="850" cy="194" r="5" fill="#d4a574"/>
  <rect x="757" y="304" width="101" height="78" rx="12" fill="#271e17" stroke="#a36f52"/>
  <text x="807" y="335" text-anchor="middle" fill="#d4a574" font-family="monospace" font-size="11">TRAPPED</text>
  <text x="807" y="354" text-anchor="middle" fill="#d4a574" font-family="monospace" font-size="11">CAPABILITY</text>
  <text x="807" y="374" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="13" font-weight="700">OVERHANG</text>

  <g transform="translate(920 164)">
    <text x="0" y="20" fill="#817d72" font-family="monospace" font-size="12" letter-spacing="2">THE BOTTLENECK MAY BE</text>
    <g transform="translate(0 48)"><rect width="216" height="55" rx="10" fill="#171813" stroke="#3c3d35"/><circle cx="23" cy="27" r="5" fill="#d4a574"/><text x="42" y="33" fill="#ddd8cd" font-family="Arial, sans-serif" font-size="16">a rigid interface</text></g>
    <g transform="translate(0 117)"><rect width="216" height="55" rx="10" fill="#171813" stroke="#3c3d35"/><circle cx="23" cy="27" r="5" fill="#a9c48c"/><text x="42" y="33" fill="#ddd8cd" font-family="Arial, sans-serif" font-size="16">a missing tool</text></g>
    <g transform="translate(0 186)"><rect width="216" height="55" rx="10" fill="#171813" stroke="#3c3d35"/><circle cx="23" cy="27" r="5" fill="#a36f52"/><text x="42" y="33" fill="#ddd8cd" font-family="Arial, sans-serif" font-size="16">a stale rule</text></g>
    <g transform="translate(0 255)"><rect width="216" height="55" rx="10" fill="#171813" stroke="#3c3d35"/><circle cx="23" cy="27" r="5" fill="#78879a"/><text x="42" y="33" fill="#ddd8cd" font-family="Arial, sans-serif" font-size="16">a valid boundary</text></g>
  </g>

  <rect x="64" y="539" width="1072" height="57" rx="12" fill="#151610" stroke="#34352f"/>
  <text x="94" y="575" fill="#8f8a7f" font-family="monospace" font-size="13" letter-spacing="1.3">GOAL</text>
  <text x="210" y="576" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="19" font-weight="700">make the envelopes match</text>
  <text x="1110" y="576" text-anchor="end" fill="#a9c48c" font-family="monospace" font-size="14">CAPABILITY ≠ AUTHORITY</text>
</svg>
