<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Sometimes missing. Sometimes excess.</title><desc id="desc">Two before-and-after comparisons. On the left, a missing log-access slot is filled with a tool. On the right, a rigid script is removed while the model, task, and a useful tool remain.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">02 / TWO DIRECTIONS, NOT TWO ERAS</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">Sometimes missing. Sometimes excess.</text>
<line x1="600" y1="166" x2="600" y2="579" stroke="#454639" stroke-width="1" /><text x="56" y="183" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="400" text-anchor="start">+</text><text x="102" y="180" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">OBSERVATION IS MISSING</text><text x="640" y="183" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="400" text-anchor="start">−</text><text x="688" y="180" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">A SCRIPT MAY BE REDUNDANT</text><text x="56" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">It cannot see what failed.</text><text x="640" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">An old workaround still dictates each step.</text><text x="56" y="271" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">BEFORE</text><text x="640" y="271" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">BEFORE</text><rect x="155" y="247" width="389" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="173" y="276.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Model + task</text><rect x="155" y="303" width="389" height="62" rx="4" fill="#171813" stroke="#c0b9aa" stroke-dasharray="5 6"/><text x="173" y="341" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">No access to logs</text><rect x="739" y="247" width="405" height="34" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="271" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Model + task</text><rect x="739" y="290" width="405" height="34" rx="4" fill="#2b251c" stroke="#dfb37b" /><text x="757" y="314" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Inherited rigid script</text><rect x="739" y="333" width="405" height="34" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="357" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Useful tool</text><path d="M200 386V438" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><text x="231" y="418" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Add access</text><path d="M784 386V438" fill="none" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><text x="816" y="418" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Test without the script</text><text x="56" y="482" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">TRIAL</text><text x="640" y="482" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">TRIAL</text><rect x="155" y="458" width="389" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="173" y="487.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Model + task</text><rect x="155" y="514" width="389" height="45" rx="4" fill="#232b20" stroke="#aec09c" /><text x="173" y="543.5" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">+ Log access tool</text><rect x="739" y="458" width="405" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="487.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Model + task</text><rect x="739" y="514" width="405" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="543.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Useful tool</text>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Diagnostic examples. Adding and removing can coexist; both changes must demonstrate their value.</text>
</svg>
