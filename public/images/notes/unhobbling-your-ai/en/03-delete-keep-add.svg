<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Every piece needs a reason</title><desc id="desc">Three rows connect observation to justification and decision: remove a workaround that no longer helps, keep a useful component or authority boundary, add a missing capability the task requires.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">03 / AUDIT BY FUNCTION</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">Every piece needs a reason</text>
<text x="56" y="148" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">A rule’s age does not decide its fate. Its function and the evidence do.</text><text x="104" y="204" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">YOU OBSERVE</text><text x="466" y="204" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">WHAT JUSTIFIES THE DECISION</text><text x="967" y="204" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">DECISION</text><line x1="56" y1="223" x2="1144" y2="223" stroke="#454639" stroke-width="1" /><text x="56" y="266" fill="#dfb37b" font-family="Georgia, DejaVu Serif, serif" font-size="22" font-weight="400" text-anchor="start">01</text><text x="104" y="263" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">An inherited</text>
<text x="104" y="292" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">workaround</text><text x="466" y="264" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Without it: same quality and limits,</text>
<text x="466" y="293" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">less cost or complexity.</text><path d="M875 274H938" fill="none" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><text x="967" y="282" fill="#dfb37b" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Remove</text><line x1="56" y1="341" x2="1144" y2="341" stroke="#454639" stroke-width="1" /><text x="56" y="384" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="22" font-weight="400" text-anchor="start">02</text><text x="104" y="381" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">A useful piece</text>
<text x="104" y="410" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">or a boundary</text><text x="466" y="382" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Prevents a demonstrated failure</text>
<text x="466" y="411" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">or defines authority.</text><path d="M875 392H938" fill="none" stroke="#df947d" stroke-width="2" marker-end="url(#rust)"/><text x="967" y="400" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Keep</text><line x1="56" y1="459" x2="1144" y2="459" stroke="#454639" stroke-width="1" /><text x="56" y="502" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="22" font-weight="400" text-anchor="start">03</text><text x="104" y="499" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">A missing</text>
<text x="104" y="528" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">capability</text><text x="466" y="500" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">The task needs evidence</text>
<text x="466" y="529" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">or an action it cannot access.</text><path d="M875 510H938" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><text x="967" y="518" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Add</text>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">If its purpose is unclear, investigate before deleting. Do not broaden authority to pass the test.</text>
</svg>
