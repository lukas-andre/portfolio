<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Every piece needs a reason</title><desc id="desc">Three rows show spreadsheet examples: test without a repeated explanation, keep a useful check or work on copies, and add a missing calculation tool.</desc><defs><marker id="ac0b9aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker><marker id="adfb37b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="aaec09c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="adf947d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="6" fill="#171813" stroke="#171813" stroke-width="1.5"/><text x="56" y="45" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" text-anchor="start">02 / STOP HOBBLING YOUR AI</text><text x="56" y="107" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="41" text-anchor="start">What should stay, go, or be added?</text><text x="56" y="171" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">OBSERVATION</text><text x="450" y="171" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">WHAT TO CHECK</text><text x="943" y="171" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">DECISION</text><rect x="56" y="200" width="1088" height="112" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><rect x="56" y="200" width="4" height="112" fill="#dfb37b"/><text x="80" y="239" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">A repeated explanation</text><text x="450" y="239" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Does removing it reduce work while</text><text x="450" y="269" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">preserving quality?</text><text x="944" y="239" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Remove if</text><text x="944" y="269" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">redundant</text><rect x="56" y="332" width="1088" height="112" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><rect x="56" y="332" width="4" height="112" fill="#aec09c"/><text x="80" y="371" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">A useful check or boundary</text><text x="450" y="371" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Does it help the result or protect a</text><text x="450" y="401" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">human decision?</text><text x="944" y="371" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Keep</text><rect x="56" y="464" width="1088" height="112" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><rect x="56" y="464" width="4" height="112" fill="#aec09c"/><text x="80" y="503" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">Cannot calculate the formula</text><text x="450" y="503" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Does a calculation tool improve the</text><text x="450" y="533" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">result?</text><text x="944" y="503" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Add if missing</text><path d="M56 612H1144" stroke="#454639"/><text x="56" y="650" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Proposed examples. If evidence is insufficient, investigate before changing.</text></svg>