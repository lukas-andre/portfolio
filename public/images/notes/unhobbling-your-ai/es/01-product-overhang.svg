<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Una forma de comprobar</title><desc id="desc">Un mismo modelo recibe la tarea de corregir una fórmula. Con conversación propone y la persona comprueba. Con herramientas puede cambiar una copia, calcular y comprobar el resultado.</desc><defs><marker id="ac0b9aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker><marker id="adfb37b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="aaec09c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="adf947d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="6" fill="#171813" stroke="#171813" stroke-width="1.5"/><text x="56" y="45" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" text-anchor="start">01 / DEJA DE ESTORBARLE A TU IA</text><text x="56" y="107" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="41" text-anchor="start">¿Puede probar lo que propone?</text><rect x="56" y="152" width="1088" height="82" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><text x="80" y="185" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" text-anchor="start">MISMO MODELO · MISMA TAREA</text><text x="80" y="218" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="start">Corregir una fórmula en una planilla</text><path d="M600 234V258H292V292" fill="none" stroke="#c0b9aa" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ac0b9aa)"/><path d="M600 258H892V292" fill="none" stroke="#aec09c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aaec09c)"/><text x="56" y="327" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">SOLO CONVERSACIÓN</text><text x="640" y="327" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">CON HERRAMIENTAS</text><rect x="56" y="355" width="475" height="128" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><text x="80" y="398" fill="#f6f0e4" font-family="Georgia, serif" font-size="30" text-anchor="start">Propone una fórmula</text><text x="80" y="437" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">La persona la aplica y comprueba</text><text x="80" y="467" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">el resultado.</text><text x="56" y="539" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">La comprobación queda</text><text x="56" y="574" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">en manos de la persona.</text><rect x="640" y="355" width="280" height="82" rx="6" fill="#232b20" stroke="#aec09c" stroke-width="1.5"/><text x="780" y="389" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle">Cambiar la fórmula</text><text x="780" y="419" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="20" text-anchor="middle">en una copia</text><rect x="970" y="355" width="174" height="82" rx="6" fill="#232b20" stroke="#aec09c" stroke-width="1.5"/><text x="1057" y="405" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" text-anchor="middle">Calcular</text><path d="M925 396H962" fill="none" stroke="#aec09c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aaec09c)"/><rect x="768" y="505" width="376" height="64" rx="6" fill="#232b20" stroke="#aec09c" stroke-width="1.5"/><text x="956" y="545" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle">Comprobar el resultado</text><path d="M1057 440V496" fill="none" stroke="#aec09c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aaec09c)"/><path d="M762 537H681V446" fill="none" stroke="#aec09c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aaec09c)" stroke-dasharray="6 6"/><path d="M56 612H1144" stroke="#454639"/><text x="56" y="650" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Ejemplo ilustrativo. Poder intentarlo no garantiza resolverlo.</text></svg>