<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">De proponer a comprobar</title><desc id="desc">Un mismo modelo y una tarea, corregir un bug, se bifurcan en dos interfaces. La de texto termina en una propuesta que ejecuta la persona. Las herramientas habilitan un ciclo de editar, probar y leer el resultado.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">01 / PRODUCT OVERHANG</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">Sabe proponer. ¿Puede comprobar?</text>
<rect x="56" y="155" width="1088" height="82" rx="5" fill="#24251e" stroke="#454639" /><text x="80" y="187" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">MISMO MODELO · MISMA TAREA</text><text x="80" y="217" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">Corregir un bug</text><text x="1118" y="207" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end">Lo que cambia: la interfaz</text><path d="M600 237V263H292V293" fill="none" stroke="#c0b9aa" stroke-width="2" marker-end="url(#muted)"/><path d="M600 263H892V293" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><text x="56" y="330" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">01 / SOLO TEXTO</text><text x="640" y="330" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">02 / EDICIÓN + TESTS</text><line x1="56" y1="347" x2="528" y2="347" stroke="#454639" stroke-width="1" /><line x1="640" y1="347" x2="1144" y2="347" stroke="#aec09c" stroke-width="1" /><rect x="56" y="371" width="472" height="117" rx="5" fill="#20211b" stroke="#454639" /><text x="80" y="410" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Un parche sugerido</text><text x="80" y="445" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">La persona lo aplica, ejecuta los tests</text>
<text x="80" y="473" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">y trae de vuelta el resultado.</text><line x1="292" y1="488" x2="292" y2="537" stroke="#c0b9aa" stroke-width="2" /><line x1="278" y1="537" x2="306" y2="537" stroke="#c0b9aa" stroke-width="3" /><text x="292" y="572" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="middle">La ejecución queda fuera del producto.</text><rect x="640" y="371" width="208" height="70" rx="5" fill="#232b20" stroke="#aec09c" /><rect x="936" y="371" width="208" height="70" rx="5" fill="#232b20" stroke="#aec09c" /><text x="744" y="415" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Editar</text><text x="1040" y="415" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="600" text-anchor="middle">Probar</text><path d="M857 406H925" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><path d="M1040 441V471H892V490" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><rect x="738" y="500" width="308" height="61" rx="5" fill="#232b20" stroke="#aec09c" /><text x="892" y="539" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Leer el resultado</text><path d="M738 530H674V451" fill="none" stroke="#aec09c" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#sage)"/><text x="1080" y="590" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="end">Iterar si hace falta</text>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Ejemplo conceptual: más capacidad de actuar no garantiza éxito ni autoriza nuevos permisos.</text>
</svg>
