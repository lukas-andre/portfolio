<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cambiar una cosa para aprender</title><desc id="desc">Una prueba fija compara A, configuración actual, con B, la misma sin una instrucción. Se repiten y comparan resultados. Se conserva el cambio si mejora sin perder calidad; si empeora o no está claro, se vuelve a A.</desc><defs><marker id="ac0b9aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker><marker id="adfb37b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="aaec09c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="adf947d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="6" fill="#171813" stroke="#171813" stroke-width="1.5"/><text x="56" y="45" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" text-anchor="start">03 / DEJA DE ESTORBARLE A TU IA</text><text x="56" y="107" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="41" text-anchor="start">¿Esa instrucción todavía ayuda?</text><rect x="56" y="148" width="1088" height="89" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><text x="80" y="181" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">LA MISMA PRUEBA PARA AMBAS VERSIONES</text><text x="80" y="217" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Modelo · tareas · herramientas · permisos · presupuesto · criterios</text><path d="M600 237V257H295V282" fill="none" stroke="#c0b9aa" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ac0b9aa)"/><path d="M600 257H905V282" fill="none" stroke="#dfb37b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#adfb37b)"/><rect x="56" y="292" width="484" height="99" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><text x="80" y="327" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="17" text-anchor="start">A / COMO ESTÁ HOY</text><text x="80" y="367" fill="#f6f0e4" font-family="Georgia, serif" font-size="29" text-anchor="start">La configuración actual</text><rect x="660" y="292" width="484" height="99" rx="6" fill="#2b251c" stroke="#dfb37b" stroke-width="1.5"/><text x="684" y="327" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="17" text-anchor="start">B / SOLO UN CAMBIO</text><text x="684" y="367" fill="#f6f0e4" font-family="Georgia, serif" font-size="27" text-anchor="start">La misma, sin una instrucción</text><path d="M295 393V421H560V439" fill="none" stroke="#c0b9aa" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ac0b9aa)"/><path d="M905 393V421H640V439" fill="none" stroke="#dfb37b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#adfb37b)"/><text x="600" y="472" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle">Repetir y comparar los resultados</text><text x="600" y="505" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle">Errores · tiempo · consumo · ayuda humana</text><path d="M600 519V531H295V547" fill="none" stroke="#aec09c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#aaec09c)"/><path d="M600 531H905V547" fill="none" stroke="#df947d" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#adf947d)"/><text x="295" y="579" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="middle">Mejora sin perder calidad → conservar B</text><text x="905" y="579" fill="#df947d" font-family="DejaVu Sans, sans-serif" font-size="21" text-anchor="middle">Empeora o no está claro → volver a A</text><path d="M56 612H1144" stroke="#454639"/><text x="56" y="650" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Procedimiento propuesto. Los límites y la definición de éxito se mantienen.</text></svg>