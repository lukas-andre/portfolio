<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">A veces falta. A veces sobra.</title><desc id="desc">Dos comparaciones antes y después. A la izquierda, un espacio vacío de acceso a logs se completa con una herramienta. A la derecha, se retira un guion rígido mientras el modelo, la tarea y una herramienta útil permanecen.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">02 / DOS DIRECCIONES, NO DOS ÉPOCAS</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">A veces falta. A veces sobra.</text>
<line x1="600" y1="166" x2="600" y2="579" stroke="#454639" stroke-width="1" /><text x="56" y="183" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="400" text-anchor="start">+</text><text x="102" y="180" fill="#aec09c" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">FALTA OBSERVACIÓN</text><text x="640" y="183" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="400" text-anchor="start">−</text><text x="688" y="180" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" font-weight="400" text-anchor="start">SOBRA UN GUION</text><text x="56" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">No puede ver qué falló.</text><text x="640" y="214" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Un parche antiguo aún dicta los pasos.</text><text x="56" y="271" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">ANTES</text><text x="640" y="271" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">ANTES</text><rect x="155" y="247" width="389" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="173" y="276.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Modelo + tarea</text><rect x="155" y="303" width="389" height="62" rx="4" fill="#171813" stroke="#c0b9aa" stroke-dasharray="5 6"/><text x="173" y="341" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Sin acceso a los logs</text><rect x="739" y="247" width="405" height="34" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="271" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Modelo + tarea</text><rect x="739" y="290" width="405" height="34" rx="4" fill="#2b251c" stroke="#dfb37b" /><text x="757" y="314" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Guion rígido heredado</text><rect x="739" y="333" width="405" height="34" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="357" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Herramienta útil</text><path d="M200 386V438" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><text x="231" y="418" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Añadir acceso</text><path d="M784 386V438" fill="none" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><text x="816" y="418" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">Probar sin guion</text><text x="56" y="482" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">ENSAYO</text><text x="640" y="482" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" text-anchor="start">ENSAYO</text><rect x="155" y="458" width="389" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="173" y="487.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Modelo + tarea</text><rect x="155" y="514" width="389" height="45" rx="4" fill="#232b20" stroke="#aec09c" /><text x="173" y="543.5" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">+ Herramienta de logs</text><rect x="739" y="458" width="405" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="487.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Modelo + tarea</text><rect x="739" y="514" width="405" height="45" rx="4" fill="#24251e" stroke="#c0b9aa" /><text x="757" y="543.5" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Herramienta útil</text>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Ejemplos de diagnóstico. Añadir y retirar pueden coexistir; ambos cambios deben demostrar su utilidad.</text>
