<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cada pieza necesita una razón</title><desc id="desc">Tres filas muestran ejemplos de una planilla: probar sin una explicación repetida, conservar una comprobación útil o el trabajo sobre copias, y añadir una herramienta de cálculo cuando falta.</desc><defs><marker id="ac0b9aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker><marker id="adfb37b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="aaec09c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="adf947d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker></defs><rect x="0" y="0" width="1200" height="675" rx="6" fill="#171813" stroke="#171813" stroke-width="1.5"/><text x="56" y="45" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="15" text-anchor="start">02 / DEJA DE ESTORBARLE A TU IA</text><text x="56" y="107" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="41" text-anchor="start">¿Qué retirar, conservar o añadir?</text><text x="56" y="171" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">OBSERVACIÓN</text><text x="450" y="171" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">QUÉ COMPROBAR</text><text x="943" y="171" fill="#c0b9aa" font-family="DejaVu Sans Mono, monospace" font-size="16" text-anchor="start">DECISIÓN</text><rect x="56" y="200" width="1088" height="112" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><rect x="56" y="200" width="4" height="112" fill="#dfb37b"/><text x="80" y="239" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">Una explicación repetida</text><text x="450" y="239" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">¿Sin ella hay menos trabajo y la</text><text x="450" y="269" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">misma calidad?</text><text x="944" y="239" fill="#dfb37b" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Retirar si sobra</text><rect x="56" y="332" width="1088" height="112" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><rect x="56" y="332" width="4" height="112" fill="#aec09c"/><text x="80" y="371" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">Una comprobación útil o un</text><text x="80" y="401" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">límite</text><text x="450" y="371" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">¿Ayuda al resultado o protege una</text><text x="450" y="401" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">decisión humana?</text><text x="944" y="371" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Conservar</text><rect x="56" y="464" width="1088" height="112" rx="6" fill="#24251e" stroke="#454639" stroke-width="1.5"/><rect x="56" y="464" width="4" height="112" fill="#aec09c"/><text x="80" y="503" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="24" text-anchor="start">No puede calcular la fórmula</text><text x="450" y="503" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">¿Una herramienta de cálculo mejora</text><text x="450" y="533" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">el resultado?</text><text x="944" y="503" fill="#aec09c" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="start">Añadir si falta</text><path d="M56 612H1144" stroke="#454639"/><text x="56" y="650" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="start">Ejemplos propuestos. Si la evidencia no alcanza, investiga antes de cambiar.</text></svg>