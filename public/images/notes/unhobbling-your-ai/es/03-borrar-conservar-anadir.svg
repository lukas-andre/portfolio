<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Cada pieza necesita una razón</title><desc id="desc">Matriz de tres filas que relaciona observación, justificación y decisión: retirar un parche que ya no aporta, conservar una pieza útil o un límite de autoridad, añadir una capacidad necesaria que falta.</desc>
<defs><marker id="sage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#aec09c"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dfb37b"/></marker><marker id="rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df947d"/></marker><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c0b9aa"/></marker></defs>
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#171813" stroke="none" />
<text x="56" y="44" fill="#dfb37b" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">03 / AUDITAR POR FUNCIÓN</text>
<text x="56" y="101" fill="#f6f0e4" font-family="Georgia, DejaVu Serif, serif" font-size="40" font-weight="400" text-anchor="start">Cada pieza necesita una razón</text>
<text x="56" y="148" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start">La antigüedad de una regla no decide su destino. Su función y la evidencia, sí.</text><text x="104" y="204" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">OBSERVAS</text><text x="466" y="204" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">LO QUE JUSTIFICA EL CAMBIO</text><text x="967" y="204" fill="#969584" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="400" text-anchor="start">DECISIÓN</text><line x1="56" y1="223" x2="1144" y2="223" stroke="#454639" stroke-width="1" /><text x="56" y="266" fill="#dfb37b" font-family="Georgia, DejaVu Serif, serif" font-size="22" font-weight="400" text-anchor="start">01</text><text x="104" y="263" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">Un parche</text>
<text x="104" y="292" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">heredado</text><text x="466" y="264" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Sin él: igual calidad y límites,</text>
<text x="466" y="293" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">menos costo o complejidad.</text><path d="M875 274H938" fill="none" stroke="#dfb37b" stroke-width="2" marker-end="url(#amber)"/><text x="967" y="282" fill="#dfb37b" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Retirar</text><line x1="56" y1="341" x2="1144" y2="341" stroke="#454639" stroke-width="1" /><text x="56" y="384" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="22" font-weight="400" text-anchor="start">02</text><text x="104" y="381" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">Una pieza útil</text>
<text x="104" y="410" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">o un límite</text><text x="466" y="382" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">Evita una falla comprobada</text>
<text x="466" y="411" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">o define autoridad.</text><path d="M875 392H938" fill="none" stroke="#df947d" stroke-width="2" marker-end="url(#rust)"/><text x="967" y="400" fill="#df947d" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Conservar</text><line x1="56" y1="459" x2="1144" y2="459" stroke="#454639" stroke-width="1" /><text x="56" y="502" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="22" font-weight="400" text-anchor="start">03</text><text x="104" y="499" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">Una capacidad</text>
<text x="104" y="528" fill="#f6f0e4" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" text-anchor="start">ausente</text><text x="466" y="500" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">La tarea necesita evidencia</text>
<text x="466" y="529" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">o una acción que falta.</text><path d="M875 510H938" fill="none" stroke="#aec09c" stroke-width="2" marker-end="url(#sage)"/><text x="967" y="518" fill="#aec09c" font-family="Georgia, DejaVu Serif, serif" font-size="27" font-weight="400" text-anchor="start">Añadir</text>
<line x1="56" y1="613" x2="1144" y2="613" stroke="#454639" stroke-width="1" />
<text x="56" y="647" fill="#c0b9aa" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="start">Si no sabes para qué sirve, investiga antes de borrar. La autoridad no se amplía para hacer pasar la prueba.</text>
</svg>
